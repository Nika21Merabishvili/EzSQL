<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EzSQL{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗃️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens (mirrors frontend/src/styles/main.css :root) ─────────── */
    :root {
      --bg-canvas:      #F7FAF8;
      --bg-elevated:    #FFFFFF;
      --bg-subtle:      #F1F5F3;
      --bg-accent-soft: #ECFDF5;
      --border-subtle:  #E5E9E7;
      --border-default: #CBD5D1;
      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-tertiary:  #94A3B8;
      --text-on-accent: #FFFFFF;
      --accent:         #10B981;
      --accent-hover:   #059669;
      --accent-strong:  #047857;
      --accent-soft:    #D1FAE5;
      --danger:         #DC2626;
      --danger-soft:    #FEE2E2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.10);
    }

    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg-canvas);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Flash messages (above the card) ────────────────────────────────────── */
    .messages {
      list-style: none;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 3px solid;
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .message.success,
    .message.info {
      background: var(--accent-soft);
      color: var(--accent-strong);
      border-left-color: var(--accent);
    }

    .message.error,
    .message.warning {
      background: var(--danger-soft);
      color: var(--danger);
      border-left-color: var(--danger);
    }

    /* ── Wordmark ───────────────────────────────────────────────────────────── */
    .wordmark {
      text-align: center;
      margin-bottom: 24px;
    }

    .wordmark-logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-strong);
      letter-spacing: -0.5px;
    }

    .wordmark-tagline {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 3px;
    }

    /* ── Card ───────────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.4;
    }

    /* ── Google button ──────────────────────────────────────────────────────── */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: var(--text-on-accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-google:hover {
      background: var(--accent-hover);
    }

    .btn-google .g-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #FFFFFF;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── Cancel / back link ─────────────────────────────────────────────────── */
    .cancel-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.12s;
    }

    .cancel-link:hover {
      color: var(--accent-strong);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="message {{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <div class="wordmark">
    <div class="wordmark-logo">EzSQL</div>
    <div class="wordmark-tagline">Browser-Based SQL Interface</div>
  </div>

  <div class="card">
    {% block card_content %}{% endblock %}
  </div>

</body>
</html>
